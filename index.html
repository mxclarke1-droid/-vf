<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Santa Tracker — North Pole Tracking Network</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://threejs.org/examples/js/controls/OrbitControls.js"></script>
<script src="https://threejs.org/examples/js/loaders/GLTFLoader.js"></script>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#info {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 20;
    color: white;
    background: rgba(0,0,0,0.8);
    padding: 15px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
}

#title {
    font-size: 20px;
    font-weight: bold;
}

#status {
    margin-top: 8px;
    color: #00ff66;
    font-size: 14px;
}

#modelStatus {
    margin-top: 5px;
    color: #00ff66;
    font-size: 13px;
}

#startButton {
    margin-top: 12px;
    padding: 10px 18px;
    border: none;
    border-radius: 7px;
    background: #d71920;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#startButton.active {
    background: #159447;
}

#error {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 30;
    color: #ff4444;
    background: rgba(0,0,0,0.9);
    padding: 12px;
    border-radius: 7px;
    display: none;
}
</style>
</head>

<body>

<div id="info">

    <div id="title">
        🎅 SANTA TRACKER
    </div>

    <div>
        North Pole Tracking Network
    </div>

    <div id="status">
        STARTING EARTH...
    </div>

    <div id="modelStatus">
        SANTA MODEL: LOADING...
    </div>

    <button id="startButton">
        START TRACKING
    </button>

</div>

<div id="error"></div>

<script>

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

/*
   FARTHER BACK so the entire Earth
   is visible immediately.
*/

camera.position.set(
    0,
    0,
    7
);

camera.lookAt(
    0,
    0,
    0
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   CONTROLS
========================================================= */

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = 0.05;
