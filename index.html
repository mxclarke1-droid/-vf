<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santa Tracker — North Pole Tracking Network</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://threejs.org/examples/js/controls/OrbitControls.js"></script>
<script src="https://threejs.org/examples/js/loaders/GLTFLoader.js"></script>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    #info {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        color: white;
        background: rgba(0,0,0,0.75);
        padding: 15px 18px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.2);
    }

    #title {
        font-size: 20px;
        font-weight: bold;
    }

    #status {
        margin-top: 8px;
        color: #00ff66;
        font-size: 14px;
    }

    #startButton {
        margin-top: 12px;
        padding: 10px 18px;
        border: none;
        border-radius: 7px;
        background: #d71920;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    #startButton.active {
        background: #159447;
    }

    #error {
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 10;
        color: #ff4444;
        background: rgba(0,0,0,0.8);
        padding: 10px;
        border-radius: 7px;
        display: none;
    }
</style>
</head>

<body>

<div id="info">
    <div id="title">🎅 SANTA TRACKER</div>
    <div>North Pole Tracking Network</div>
    <div id="status">STANDBY — Waiting for tracking...</div>
    <button id="startButton">START TRACKING</button>
</div>

<div id="error"></div>

<script>

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    1000
);

camera.position.set(0, 1.0, 6);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

document.body.appendChild(renderer.domElement);


/* =========================================================
   CONTROLS
========================================================= */

const controls = new THREE.OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 2.5;
controls.maxDistance = 20;


/* =========================================================
   LIGHTING
========================================================= */

const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
directionalLight.position.set(5, 5, 5);
scene.add(directionalLight);


/* =========================================================
   EARTH
========================================================= */

const EARTH_RADIUS = 2.0;

const earthGeometry = new THREE.SphereGeometry(
    EARTH_RADIUS,
    128,
    128
);

const earthTexture = new THREE.TextureLoader().load(
    "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
);

const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthTexture
});

const earth = new THREE.Mesh(
    earthGeometry,
    earthMaterial
);

scene.add(earth);


/* =========================================================
   ATMOSPHERE
========================================================= */

const atmosphereGeometry = new THREE.SphereGeometry(
    EARTH_RADIUS * 1.025,
    96,
    96
);

const atmosphereMaterial = new THREE.MeshBasicMaterial({
    color: 0x3399ff,
    transparent: true,
    opacity: 0.10,
    side: THREE.BackSide
});

const atmosphere = new THREE.Mesh(
    atmosphereGeometry,
    atmosphereMaterial
);

scene.add(atmosphere);


/* =========================================================
   SANTA GROUP
========================================================= */

const santaGroup = new THREE.Group();

scene.add(santaGroup);

let santaModel = null;
let santaLoaded = false;


/* =========================================================
   SANTA SETTINGS
========================================================= */

const SANTA_RADIUS = 2.28;

/*
   BIGGER SLEIGH

   Previous:
   0.30

   New:
   0.45
*/

const SANTA_SIZE = 0.45;


/* =========================================================
   LOAD SANTA GLB
========================================================= */

const loader = new THREE.GLTFLoader();

loader.load(
    "santa_-_norad_santa_tracker.glb",

    function(gltf) {

        santaModel = gltf.scene;

        /*
           Find the size of the imported model
        */

        const box = new THREE.Box3().setFromObject(santaModel);

        const size = new THREE.Vector3();

        box.getSize(size);

        const largestDimension = Math.max(
            size.x,
            size.y,
            size.z
        );

        /*
           Normalize model size
        */

        const scale =
            SANTA_SIZE / largestDimension;

        santaModel.scale.setScalar(scale);

        /*
           Center the model
        */

        const centeredBox =
            new THREE.Box3().setFromObject(santaModel);

        const center =
            centeredBox.getCenter(new THREE.Vector3());

        santaModel.position.sub(center);


        /*
           ONE-TIME MODEL ROTATION

           This corrects the direction the
           sleigh faces.

           Do NOT rotate it every frame.
        */

        santaModel.rotation.y = -Math.PI / 2;


        santaGroup.add(santaModel);

        santaLoaded = true;

        document.getElementById("status").textContent =
            "SANTA MODEL LOADED — READY";


        /*
           Put Santa somewhere immediately visible
        */

        const startPosition =
            latLonToVector3(
                route[0].lat,
                route[0].lon,
                SANTA_RADIUS
            );

        santaGroup.position.copy(startPosition);

    },

    function(xhr) {

        if (xhr.total) {

            const percent =
                Math.round(
                    xhr.loaded / xhr.total * 100
                );

            document.getElementById("status").textContent =
                "LOADING SANTA... " + percent + "%";
        }

    },

    function(error) {

        console.error(error);

        document.getElementById("error").style.display =
            "block";

        document.getElementById("error").textContent =
            "ERROR: santa_-_norad_santa_tracker.glb could not be loaded.";

        document.getElementById("status").textContent =
            "SANTA MODEL ERROR";
    }
);


/* =========================================================
   ROUTE
========================================================= */

const route = [

    { lat: 66.0, lon: 180.0 },

    { lat: -41.3, lon: 174.8 },

    { lat: -33.9, lon: 151.2 },

    { lat: 35.7, lon: 139.7 },

    { lat: 37.5, lon: 127.0 },

    { lat: 39.9, lon: 116.4 },

    { lat: 28.6, lon: 77.2 },

    { lat: 25.3, lon: 55.3 },

    { lat: 51.5, lon: -0.1 },

    { lat: 6.5, lon: 3.4 },

    { lat: -23.5, lon: -46.6 },

    { lat: 18.2, lon: -66.5 },

    { lat: 18.7, lon: -70.2 },

    { lat: 38.9, lon: -77.0 },

    { lat: 41.9, lon: -87.6 },

    { lat: 39.7, lon: -104.9 },

    { lat: 34.0, lon: -118.2 },

    { lat: 61.2, lon: -149.9 },

    { lat: 21.3, lon: -157.8 },

    { lat: 89.0, lon: 0.0 }
];


/* =========================================================
   LAT/LON → 3D POSITION
========================================================= */

function latLonToVector3(lat, lon, radius) {

    const phi =
        (90 - lat) * Math.PI / 180;

    const theta =
        (lon + 180) * Math.PI / 180;

    const x =
        -radius *
        Math.sin(phi) *
        Math.cos(theta);

    const y =
        radius *
        Math.cos(phi);

    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    return new THREE.Vector3(x, y, z);
}


/* =========================================================
   TRACKING VARIABLES
========================================================= */

let tracking = false;

let routeIndex = 0;

let segmentStartTime = 0;

const SEGMENT_DURATION = 60000;


/* =========================================================
   START TRACKING
========================================================= */

document.getElementById("startButton")
    .addEventListener("click", function() {

        tracking = true;

        routeIndex = 0;

        segmentStartTime =
            performance.now();

        this.classList.add("active");

        this.textContent =
            "TRACKING ACTIVE";

        document.getElementById("status").textContent =
            "🛰️ TRACKING SANTA — LIVE";

        controls.enabled = false;

        /*
           Put Santa at beginning of route
        */

        if (santaLoaded) {

            santaGroup.position.copy(
                latLonToVector3(
                    route[0].lat,
                    route[0].lon,
                    SANTA_RADIUS
                )
            );
        }
    });


/* =========================================================
   MOVE SANTA
========================================================= */

function updateSanta(time) {

    if (!tracking || !santaLoaded) {
        return;
    }

    if (routeIndex >= route.length - 1) {
        routeIndex = 0;
        segmentStartTime = time;
    }

    const start =
        latLonToVector3(
            route[routeIndex].lat,
            route[routeIndex].lon,
            SANTA_RADIUS
        );

    const end =
        latLonToVector3(
            route[routeIndex + 1].lat,
            route[routeIndex + 1].lon,
            SANTA_RADIUS
        );

    let progress =
        (time - segmentStartTime) /
        SEGMENT_DURATION;

    if (progress >= 1) {

        routeIndex++;

        segmentStartTime = time;

        progress = 0;
    }

    /*
       Smooth movement along the globe
    */

    const currentPosition =
        new THREE.Vector3();

    currentPosition.lerpVectors(
        start,
        end,
        progress
    );

    santaGroup.position.copy(
        currentPosition
    );


    /* =====================================================
       TURN SANTA IN THE DIRECTION OF FLIGHT
    ===================================================== */

    const direction =
        new THREE.Vector3()
            .subVectors(end, start)
            .normalize();

    const up =
        currentPosition.clone()
            .normalize();

    const right =
        new THREE.Vector3()
            .crossVectors(up, direction)
            .normalize();

    const correctedDirection =
        new THREE.Vector3()
            .crossVectors(right, up)
            .normalize();

    const rotationMatrix =
        new THREE.Matrix4();

    rotationMatrix.lookAt(
        new THREE.Vector3(0, 0, 0),
        correctedDirection,
        up
    );

    const targetQuaternion =
        new THREE.Quaternion();

    targetQuaternion.setFromRotationMatrix(
        rotationMatrix
    );

    santaGroup.quaternion.slerp(
        targetQuaternion,
        0.08
    );


    /* =====================================================
       CAMERA FOLLOW
    ===================================================== */

    const cameraOffset =
        currentPosition.clone()
            .normalize()
            .multiplyScalar(0.75);

    const cameraTarget =
        currentPosition.clone()
            .add(cameraOffset);

    camera.position.lerp(
        cameraTarget,
        0.08
    );

    camera.lookAt(
        currentPosition
    );
}


/* =========================================================
   ANIMATION
========================================================= */

function animate(time) {

    requestAnimationFrame(animate);

    /*
       Very slow Earth rotation
    */

    earth.rotation.y += 0.00015;

    atmosphere.rotation.y =
        earth.rotation.y;

    updateSanta(time);

    if (!tracking) {
        controls.update();
    }

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
