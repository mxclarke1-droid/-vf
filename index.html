<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Santa Tracker Test</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#status {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    color: white;
    background: rgba(0,0,0,.8);
    padding: 15px;
    font-family: Arial;
    border-radius: 8px;
}

#error {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 20;
    color: red;
    background: black;
    padding: 15px;
    font-family: Arial;
    display: none;
}
</style>
</head>

<body>

<div id="status">
    🌎 EARTH STARTING...
</div>

<div id="error"></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =====================================================
   BASIC THREE.JS
===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);


const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.z = 7;


const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHT
===================================================== */

const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(
    5,
    5,
    5
);

scene.add(light);


const ambient = new THREE.AmbientLight(
    0xffffff,
    1
);

scene.add(ambient);


/* =====================================================
   EARTH
===================================================== */

const earthGeometry =
    new THREE.SphereGeometry(
        2,
        64,
        64
    );


const earthMaterial =
    new THREE.MeshPhongMaterial({
        color: 0x1677cc
    });


const earth =
    new THREE.Mesh(
        earthGeometry,
        earthMaterial
    );

scene.add(earth);


/* =====================================================
   SANTA
===================================================== */

const santaGroup =
    new THREE.Group();

scene.add(
    santaGroup
);


/*
   Put Santa directly in front
   of the Earth.
*/

santaGroup.position.set(
    0,
    0,
    2.4
);


/* =====================================================
   LOAD GLB
===================================================== */

const gltfLoader =
    new THREE.GLTFLoader();


gltfLoader.load(

    "santa_-_norad_santa_tracker.glb",

    function(gltf) {

        const model =
            gltf.scene;


        /*
           Find model size.
        */

        const box =
            new THREE.Box3()
                .setFromObject(
                    model
                );


        const size =
            new THREE.Vector3();

        box.getSize(
            size
        );


        const biggest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        /*
           Make Santa visible.
        */

        if (biggest > 0) {

            model.scale.setScalar(
                0.7 / biggest
            );

        }


        /*
           Center model.
        */

        const newBox =
            new THREE.Box3()
                .setFromObject(
                    model
                );


        const center =
            newBox.getCenter(
                new THREE.Vector3()
            );


        model.position.sub(
            center
        );


        santaGroup.add(
            model
        );


        document.getElementById(
            "status"
        ).innerHTML =
            "🌎 EARTH WORKING<br>🎅 SANTA LOADED";


    },

    function(xhr) {

        document.getElementById(
            "status"
        ).innerHTML =
            "🌎 EARTH WORKING<br>🎅 LOADING SANTA...";

    },

    function(error) {

        console.error(error);

        document.getElementById(
            "error"
        ).style.display =
            "block";

        document.getElementById(
            "error"
        ).textContent =
            "SANTA GLB FAILED TO LOAD";

        document.getElementById(
            "status"
        ).innerHTML =
            "🌎 EARTH WORKING<br>❌ SANTA FAILED";

    }

);


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    /*
       Slowly rotate Earth.
    */

    earth.rotation.y += 0.002;


    renderer.render(
        scene,
        camera
    );

}

animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

<!-- GLTF LOADER -->
<script src="https://threejs.org/examples/js/loaders/GLTFLoader.js"></script>

</body>
</html>
